text_prompt: 

#===============================================================================
max_nfe: 500
batch_size: 50
#===============================================================================

root_dir: ./results
tag: ${filtering_method}_${seed}
save_now: True

device: 0
seed: 0

block_size: 1
n_particles: 1
minibatch_size: 5
filtering_method: bon

#===============================================================================
# Trainer settings 
#===============================================================================
max_steps: 10
disable_debug: False

#===============================================================================
# Dataset 
#===============================================================================
height: 1024
width: 1024

#===============================================================================
# Time sampler 
#===============================================================================
time_sampler: flux_scheduler
time_schedule: exp
t_max: 1000

#===============================================================================
# Model 
#===============================================================================
model: flux_image
channels: 4096 # [B 4096 64]

#===============================================================================
# Prior
#===============================================================================
prior: flux
guidance_scale: 3.5
sample_method: ode

convert_scheduler: polynomial
scheduler_n: 1

diffusion_coefficient: square
diffusion_norm: 0.0

# Only used for "exp" diffusion coefficient
exp_diff_coeff_sigma: 0.1

model_name: "black-forest-labs/FLUX.1-schnell"

#===============================================================================
# Logger
#===============================================================================
logger: self
log_interval: 1

#===============================================================================
# Corrector
#===============================================================================
corrector: particle

reward_weight: 0.5
reward_score: vqa

vqa_model: clip-flant5-xxl
vqa_device: 1
vqa_batch_size: 32

image_reward_weight: 0.0
